<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="제빵 실기 예상">
  <meta name="theme-color" content="#5C4033">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>제빵 실기 예상</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #f6f1ea;
      --surface: #fffcf7;
      --text: #2b1c16;
      --muted: #7a6254;
      --accent: #5c4033;
      --line: #e6d9cc;
      --danger: #9a3b2f;
      --ok: #3d6b4f;
      --warn: #8a5a20;
      --radius: 16px;
      --tap: 44px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    }
    button, input, select, textarea {
      font-family: var(--font);
      font-size: inherit;
      color: var(--text);
    }
    button { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; }
    .app { width: min(430px, 100%); max-width: 100%; margin: 0 auto; padding: 8px 18px 104px; overflow-x: hidden; }
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--line);
    }
    .tabbar button { min-height: 48px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .tabbar button.on { color: var(--accent); }
    .topbar { display: flex; align-items: center; min-height: 44px; gap: 8px; margin-bottom: 6px; }
    .topbar h1, .topbar h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 700; text-align: center; }
    .ghost { min-width: 48px; min-height: 44px; color: var(--accent); font-weight: 600; font-size: 14px; }
    .lede { margin: 0 0 12px; color: var(--muted); font-size: 14px; word-break: keep-all; overflow-wrap: break-word; }
    .lede-line { display: block; }
    .lede.tight { margin: 0 0 10px; }
    .lede .inline { min-width: 0; min-height: 0; font-size: 14px; font-weight: 700; }
    .site { margin: 0 0 10px; color: var(--accent); font-size: 13px; font-weight: 700; }
    .card {
      padding: 14px 16px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--line);
    }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;
    }
    .stats .card { text-align: center; padding: 12px 8px; }
    .stats small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
    .stats strong { display: block; margin-top: 4px; font-size: 22px; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 48px; margin-top: 10px; border-radius: 999px; font-weight: 700;
    }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn-row .btn { margin-top: 0; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #efe4d8; color: var(--accent); }
    .btn-danger { color: var(--danger); }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field span, .section-title { color: var(--muted); font-size: 13px; font-weight: 700; }
    .section-title { margin: 18px 0 8px; }
    input[type="text"], input[type="date"], input[type="month"], input[type="number"], input[type="file"], select, textarea {
      width: 100%; min-width: 0; min-height: 48px; padding: 10px 14px;
      border: 1px solid #d9c9ba; border-radius: 12px; background: #fff;
      color: var(--text);
      font-family: var(--font);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      -webkit-text-fill-color: var(--text);
      opacity: 1;
    }
    input[type="date"], input[type="number"], input[type="month"] {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      letter-spacing: 0.02em;
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
    }
    input[type="date"]::-webkit-datetime-edit,
    input[type="date"]::-webkit-datetime-edit-fields-wrapper,
    input[type="date"]::-webkit-datetime-edit-text,
    input[type="date"]::-webkit-datetime-edit-year-field,
    input[type="date"]::-webkit-datetime-edit-month-field,
    input[type="date"]::-webkit-datetime-edit-day-field,
    input[type="date"]::-webkit-date-and-time-value {
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
      font-family: var(--font);
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.03em;
      padding: 0;
    }
    .lookup {
      display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 6px;
      align-items: center; margin: 0 0 10px; width: 100%; max-width: 100%;
    }
    .lookup.has-round { grid-template-columns: 48px minmax(0, 1fr) 72px 48px; }
    .lookup .ghost {
      min-width: 0; width: 100%; height: 48px; min-height: 48px;
      background: #efe4d8; border-radius: 12px;
      font-weight: 700; font-size: 14px; color: var(--accent);
    }
    .lookup .ghost:disabled { opacity: 0.35; cursor: default; }
    .date-wrap {
      position: relative; margin: 0;
      width: 100%; max-width: 100%; height: 48px; max-height: 48px;
      overflow: hidden; border-radius: 12px;
    }
    .date-face {
      height: 48px; padding: 0 36px 0 12px;
      border: 1px solid #d9c9ba; border-radius: 12px; background: #fff;
      color: var(--accent); font-weight: 700; font-size: 16px;
      font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
      display: flex; align-items: center;
    }
    .date-wrap input[type="date"] {
      position: absolute; left: 0; top: 0; z-index: 2;
      width: 100%; max-width: 100%; height: 48px; max-height: 48px;
      margin: 0; padding: 0; border: 0; border-radius: 12px;
      opacity: 0; background: transparent;
      -webkit-appearance: none; appearance: none;
    }
    .date-wrap .cal-ico {
      position: absolute; right: 10px; top: 0; bottom: 0; width: 20px; z-index: 1;
      display: flex; align-items: center; pointer-events: none; color: var(--accent);
    }
    .date-wrap .cal-ico svg {
      width: 20px; height: 20px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .date-wrap input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0; width: 100%; height: 48px; margin: 0; padding: 0;
    }
    .round-wrap {
      height: 48px; border: 1px solid #d9c9ba; border-radius: 12px; background: #fff;
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: 0; min-width: 0; overflow: hidden; padding: 0 6px 0 2px;
    }
    .round-wrap span { color: var(--accent); font-size: 15px; font-weight: 700; line-height: 1; flex: 0 0 auto; }
    .lookup .round-wrap input[type="number"] {
      width: 2.2em; min-width: 0; min-height: 0; height: 28px; margin: 0; padding: 0;
      border: 0; background: transparent; text-align: right;
      font-size: 16px; font-weight: 700; color: var(--accent);
      -webkit-text-fill-color: var(--accent);
      -webkit-appearance: none; appearance: none;
    }
    .lookup .round-wrap input[type="number"]::-webkit-outer-spin-button,
    .lookup .round-wrap input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
    .sample {
      margin: 0; padding: 12px 14px; border-radius: 12px; background: #efe4d8;
      color: var(--text); font-size: 13px; white-space: pre-wrap; word-break: break-all;
    }
    .ok { color: var(--ok); font-size: 14px; font-weight: 700; }
    .switch {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin: 0 0 16px; padding: 4px; border-radius: 12px; background: #efe4d8;
    }
    .switch button {
      flex: 1 1 22%; min-height: 40px; border-radius: 10px; font-weight: 700; color: var(--muted); font-size: 14px;
    }
    .switch button.on { background: var(--surface); color: var(--accent); }
    .rank {
      display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--line);
    }
    .rank:last-child { border-bottom: 0; }
    .num {
      width: 28px; height: 28px; border-radius: 999px; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    }
    .num.dim { background: #efe4d8; color: var(--muted); }
    .rank small { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
    .rank.hit {
      margin: 0 -8px; padding-left: 8px; padding-right: 8px;
      background: #efe4d8; border-radius: 12px;
    }
    .mark {
      display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px;
      background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
      vertical-align: middle;
    }
    .actual {
      margin: 0 0 10px; color: var(--accent); font-size: 15px; font-weight: 700;
      word-break: keep-all;
    }
    .actual.soon { color: var(--muted); font-weight: 600; }
    .bar { height: 5px; border-radius: 99px; background: #efe4d8; margin-top: 5px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .cal-head {
      display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-bottom: 8px;
    }
    .cal-head h2 { margin: 0; text-align: center; font-size: 18px; }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
    .week span { text-align: center; color: var(--muted); font-size: 12px; font-weight: 700; padding: 6px 0; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day {
      min-height: 64px; border-radius: 12px; padding: 4px 2px 6px;
      background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .day.on { background: var(--surface); border: 1px solid var(--line); }
    .day.today { outline: 2px solid var(--accent); }
    .day.pick { background: #efe4d8; }
    .day.empty { visibility: hidden; }
    .day b { font-size: 13px; }
    .day .tag {
      font-size: 10px; font-weight: 700; line-height: 1.2; color: var(--accent);
      text-align: center; word-break: keep-all; max-width: 100%;
    }
    .day .tag.dim { color: var(--muted); font-weight: 600; }
    .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--accent); }
    .muted { color: var(--muted); font-size: 14px; }
    .warn { color: var(--warn); font-size: 13px; }
    .item-link {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 14px 0; text-align: left; border-bottom: 1px solid var(--line); width: 100%;
    }
    .item-link strong { display: block; }
    .item-link span { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
    .pill { display: inline-block; padding: 5px 10px; border-radius: 999px; background: #efe4d8; color: var(--accent); font-size: 12px; font-weight: 700; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .hidden { display: none; }
    .record {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .footer-actions { margin-top: 24px; display: flex; flex-direction: column; gap: 4px; }
    .footer-actions button { min-height: 40px; color: var(--muted); font-size: 14px; }
    .empty { padding: 16px 8px; text-align: center; color: var(--muted); }
    .choice {
      width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line);
      border-radius: 12px; background: var(--surface); min-height: 48px;
    }
    .choice.on { border-color: var(--accent); background: #efe4d8; font-weight: 700; }
  </style>
</head>
<body>
  <main class="app" id="app"></main>
  <script>
(function () {
  var STORAGE_KEY = "bakery-predict-practical-v1";
  var SEED_HASH_KEY = STORAGE_KEY + "-seed-hash";
  var APP_VERSION = "20260916j";
  var WEEK = ["일", "월", "화", "수", "목", "금", "토"];

  var ITEMS = [
    { id: "white", name: "비상식빵", note: "비상스트레이트법" },
    { id: "milk", name: "우유식빵", note: "우유 함량·색" },
    { id: "corn", name: "옥수수식빵", note: "콘밀 배합" },
    { id: "rye", name: "호밀빵", note: "호밀 비율" },
    { id: "pullman", name: "풀만식빵", note: "뚜껑 타이밍" },
    { id: "buttertop", name: "버터톱식빵", note: "버터 토핑" },
    { id: "chestnut", name: "밤식빵", note: "밤 고르게" },
    { id: "rice", name: "쌀식빵", note: "쌀가루 배합" },
    { id: "ww", name: "통밀빵", note: "통밀 흡수" },
    { id: "redbean", name: "단팥빵", note: "앙금 밀봉" },
    { id: "soboro", name: "소보로빵", note: "소보로 크럼블" },
    { id: "cream", name: "크림빵", note: "충전 후 터짐" },
    { id: "twist", name: "트위스트형", note: "꼬임 균일" },
    { id: "sweetroll", name: "스위트롤", note: "말기·컷팅" },
    { id: "butterroll", name: "버터롤", note: "성형 결" },
    { id: "mocha", name: "모카빵", note: "모카 토핑" },
    { id: "donut", name: "빵도넛", note: "튀김 온도" },
    { id: "grissini", name: "그리시니", note: "가늘고 균일" },
    { id: "bagel", name: "베이글", note: "데치기" },
    { id: "sausage", name: "소시지빵", note: "감기·밀봉" },
    { id: "pending", name: "진행 전", skip: true },
    { id: "unknown", name: "미확인", skip: true },
    { id: "none", name: "미실시", skip: true }
  ];

  function uid() {
    return crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random();
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function isFutureDate(date) {
    return date > todayStr();
  }

  function isBlankItemId(id) {
    return !id || id === "unknown" || id === "pending";
  }

  function blankItemForDate(date) {
    return isFutureDate(date) ? "pending" : "unknown";
  }

  function normalizeRecord(row) {
    if (!row) return row;
    if (isBlankItemId(row.itemId)) row.itemId = blankItemForDate(row.date);
    return row;
  }

  function normalizeRecords() {
    var changed = false;
    state.records.forEach(function (row) {
      if (!isBlankItemId(row.itemId)) return;
      var next = blankItemForDate(row.date);
      if (row.itemId !== next) {
        row.itemId = next;
        changed = true;
      }
    });
    if (changed) saveState();
  }

  function monthStr(d) {
    return d.slice(0, 7);
  }

  function parseDate(str) {
    var p = str.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

  function daysBetween(a, b) {
    return Math.round((parseDate(b) - parseDate(a)) / 86400000);
  }

  function shiftDate(date, delta) {
    var d = parseDate(date);
    d.setDate(d.getDate() + delta);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function weekdayOf(date) {
    return parseDate(date).getDay();
  }

  function familyOf(name) {
    var n = String(name || "");
    if (n.indexOf("식빵") !== -1 || n.indexOf("풀만") !== -1 || n.indexOf("우유") !== -1 || n.indexOf("비상") !== -1) return "식빵";
    if (n.indexOf("호밀") !== -1 || n.indexOf("통밀") !== -1 || n.indexOf("베이글") !== -1 || n.indexOf("그리시니") !== -1) return "하드";
    if (n.indexOf("크림") !== -1 || n.indexOf("단팥") !== -1 || n.indexOf("스위트") !== -1 || n.indexOf("모카") !== -1 ||
        n.indexOf("소보로") !== -1 || n.indexOf("트위스트") !== -1 || n.indexOf("소시지") !== -1 || n.indexOf("롤") !== -1 ||
        n.indexOf("도넛") !== -1 || n.indexOf("도너츠") !== -1) return "단과자";
    return "기타";
  }

  function clamp(v, min, max) {
    if (min == null) min = 0;
    if (max == null) max = 100;
    return Math.max(min, Math.min(max, v));
  }

  function mean(arr) {
    if (!arr.length) return 0;
    var s = 0;
    var i;
    for (i = 0; i < arr.length; i++) s += arr[i];
    return s / arr.length;
  }

  function stdev(arr, avg) {
    if (arr.length < 2) return Math.max(avg * 0.45, 1);
    var s = 0;
    var i;
    for (i = 0; i < arr.length; i++) s += (arr[i] - avg) * (arr[i] - avg);
    return Math.sqrt(s / (arr.length - 1));
  }

  function gaussian(x, mu, sigma) {
    if (!sigma) return 0.5;
    var z = (x - mu) / sigma;
    return Math.exp(-0.5 * z * z);
  }

  function isExamItemId(id) {
    var item = findItem(id);
    return !!(item && !item.skip);
  }

  function formatKor(str) {
    var d = parseDate(str);
    return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) + " (" + WEEK[d.getDay()] + ")";
  }

  function shiftMonth(ym, delta) {
    var p = ym.split("-").map(Number);
    var d = new Date(p[0], p[1] - 1 + delta, 1);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1);
  }

  function monthLabel(ym) {
    var p = ym.split("-").map(Number);
    return p[0] + "년 " + p[1] + "월";
  }

  function daysInMonth(ym) {
    var p = ym.split("-").map(Number);
    return new Date(p[0], p[1], 0).getDate();
  }

  function firstWeekday(ym) {
    var p = ym.split("-").map(Number);
    return new Date(p[0], p[1] - 1, 1).getDay();
  }

  var memoryStore = {};
  function readStore(key) {
    try { return localStorage.getItem(key); }
    catch (e) { return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null; }
  }
  function writeStore(key, value) {
    try { localStorage.setItem(key, value); }
    catch (e) { memoryStore[key] = value; }
  }

  function defaultState() {
    return { site: "시험장 1곳", records: [], calib: emptyCalib("") };
  }

  function emptyCalib(stamp) {
    return { stamp: stamp || "", boost: {}, factorMul: {}, n: 0, top1: 0, top3: 0, top5: 0 };
  }

  function loadState() {
    try {
      var raw = readStore(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed.records) parsed.records = [];
      if (!parsed.site) parsed.site = "시험장 1곳";
      parsed.records.forEach(normalizeRecord);
      if (!parsed.calib) parsed.calib = emptyCalib("");
      return parsed;
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() { writeStore(STORAGE_KEY, JSON.stringify(state)); }

  function findItem(id) {
    return ITEMS.find(function (item) { return item.id === id; });
  }

  function itemName(id) {
    var item = findItem(id);
    return item ? item.name : id;
  }

  function confirmedItemId(date) {
    var hit = recordsOn(date).find(function (row) { return isExamItemId(row.itemId); });
    return hit ? hit.itemId : "";
  }

  function shortItemName(id) {
    if (id === "pending") return "진행전";
    if (!id || id === "unknown") return "공란";
    if (id === "none") return "미실시";
    var name = itemName(id);
    if (name.length <= 4) return name;
    return name.replace(/식빵$/, "").replace(/형$/, "").replace(/빵$/, "") || name;
  }

  function rankOfItem(ranked, itemId) {
    var i;

  function calcMarkov(seq, itemId, pool) {

    if (prevId === itemId) return 10;
    var fromTotal = 0;
    var toCount = 0;
    var i;
    for (i = 0; i < seq.length - 1; i++) {
      if (seq[i] !== prevId) continue;
      fromTotal += 1;

    var alpha = 0.8;
    if (fromTotal === 0) {

    var examGaps = [];
    for (i = 1; i < centerDates.length; i++) {
      var sessions = countSessionsBetween(ctx.examDates, centerDates[i - 1], centerDates[i]);
      if (sessions > 0) examGaps.push(sessions);
    }
    var avgExamGap = examGaps.length ? mean(examGaps) : 5;
    var examGapStd = stdev(examGaps, avgExamGap);
    var examsSince = centerDates.length ? countSessionsAfter(ctx.examDates, centerDates[centerDates.length - 1]) : Math.min(ctx.examDates.length, 6);
    var examDueRatio = examsSince / Math.max(avgExamGap, 1);
    var calDueRatio = daysSince / Math.max(avgGap, 1);
    var dueRatio = ctx.examDates.length >= 8 ? 0.4 * calDueRatio + 0.6 * examDueRatio : calDueRatio;
    var appearCount = centerDates.length;

    var daysScore = clamp(daysSince / 70 * 85, 0, 100);
    var sessionScore = clamp(examsSince / Math.max(avgExamGap, 1) * 55, 0, 100);
    daysScore = clamp(0.55 * daysScore + 0.45 * sessionScore, 0, 100);

    var calFit = 100 * gaussian(daysSince, avgGap, gapStd);
    var examFit = 100 * gaussian(examsSince, avgExamGap, examGapStd);
    var linCal = avgGap <= 0 ? 45 : clamp(100 - Math.abs(daysSince - avgGap) / Math.max(avgGap, 1) * 110, 0, 100);
    var linExam = avgExamGap <= 0 ? 45 : clamp(100 - Math.abs(examsSince - avgExamGap) / Math.max(avgExamGap, 1) * 110, 0, 100);
    var avgFit = clamp(0.25 * linCal + 0.2 * linExam + 0.25 * calFit + 0.3 * examFit, 0, 100);
    var maxGapPressure = clamp(daysSince / maxGap * 55, 0, 100);

    var chronicMul = 1;
    if (dueRatio >= 2) chronicMul = clamp(0.95 - (dueRatio - 2) * 0.22, 0.35, 0.85);
    else if (dueRatio >= 1.5) chronicMul = clamp(1 - (dueRatio - 1.5) * 0.28, 0.55, 1);
    else if (appearCount >= 5 && dueRatio >= 1.3) chronicMul = clamp(1 - (dueRatio - 1.3) * 0.15, 0.7, 1);
    daysScore *= chronicMul;
    avgFit *= chronicMul;
    maxGapPressure *= chronicMul;
    if (dueRatio >= 1.8) avgFit = Math.min(avgFit, 48);
    else if (dueRatio >= 1.45) avgFit = Math.min(avgFit, 62);

    var examSessionsLast14 = 0;
    for (i = 0; i < ctx.examDates.length; i++) {
      if (daysBetween(ctx.examDates[i], date) <= 14) examSessionsLast14 += 1;
    }
    if (examSessionsLast14 >= 5) {
      daysScore *= 0.28;
      maxGapPressure *= 0.25;
      avgFit *= 0.62;
    } else if (examSessionsLast14 >= 3) {
      daysScore *= 0.4;
      maxGapPressure *= 0.35;
      avgFit *= 0.72;
    } else if (examSessionsLast14 >= 2) {
      daysScore *= 0.55;
      maxGapPressure *= 0.45;
      avgFit *= 0.82;
    }

    var lastAppearOffset = indexFromEnd(ctx.seq, item.id);
    if (lastAppearOffset === 0) {
      daysScore *= 0.1;
      maxGapPressure *= 0.1;
      avgFit *= 0.3;
    } else if (lastAppearOffset >= 1 && lastAppearOffset <= 2) {
      daysScore *= 0.22;
      maxGapPressure *= 0.2;
      avgFit *= 0.5;
    } else if (daysSince < 10) {
      daysScore *= 0.45;
      maxGapPressure *= 0.4;
    }

    var myFamily = familyOf(item.name);
    var lastFamily = ctx.seq.length ? familyOf(itemName(ctx.seq[ctx.seq.length - 1])) : null;
    var familyStreak = 0;
    var recentFam = takeLast(ctx.seq, 3);
    for (i = recentFam.length - 1; i >= 0; i--) {
      if (familyOf(itemName(recentFam[i])) === myFamily) familyStreak += 1;
      else break;
    }
    if (lastFamily && lastFamily === myFamily && myFamily === "하드") {
      daysScore *= 0.45;
      avgFit *= 0.5;
      maxGapPressure *= 0.4;
    } else if (familyStreak >= 2 && myFamily === "하드") {
      daysScore *= 0.6;
      avgFit *= 0.65;
      maxGapPressure *= 0.55;
    }
    if (lastFamily === "단과자" && myFamily === "하드" && dueRatio >= 1.35) {
      avgFit *= 0.55;
      daysScore *= 0.5;
      maxGapPressure *= 0.5;
    }
    if (lastFamily === "단과자" && myFamily === "식빵") {
      avgFit = Math.max(avgFit, 52);
      daysScore = Math.max(daysScore, 28);
    }

    var recentScore = 46;
    if (lastAppearOffset === 0) recentScore = 5;
    else if (lastAppearOffset === 1) recentScore = 14;
    else if (lastAppearOffset === 2) recentScore = 24;
    else if (lastAppearOffset === 3 || lastAppearOffset === 4) recentScore = 36;
    else if (lastAppearOffset == null) recentScore = 52;

    var markovScore = Math.max(calcMarkov(ctx.seq, item.id, ctx.pool), calcMarkovLookback(ctx.seq, item.id, 2, ctx.pool));
    var rotationScore = calcRotation(ctx.seq, item.id, dueRatio, 8) * chronicMul;
    if (dueRatio >= 1.7) rotationScore = Math.min(rotationScore, 52);
    if (lastFamily === "단과자" && myFamily === "하드" && dueRatio >= 1.35) rotationScore = Math.min(rotationScore, 38);
    if (appearCount <= 1) rotationScore = Math.min(rotationScore, 32);
    else if (appearCount === 2) rotationScore = Math.min(rotationScore, 48);

    var monthCount = 0;
    for (i = 0; i < centerDates.length; i++) {
      if (centerDates[i].slice(5, 7) === date.slice(5, 7)) monthCount += 1;
    }
    var monthScore = clamp(monthCount * 100 / ctx.monthTotal * 3, 0, 100);
    var freqScore = appearCount <= 0 ? 8 : appearCount === 1 ? 14 : appearCount === 2 ? 26 : appearCount <= 5 ? 52 : appearCount <= 8 ? 48 : clamp(48 - (appearCount - 8) * 3.5, 0, 100);
    var familyScore = calcFamilyAffinity(item.name, ctx.seq);
    var roundDupScore = ctx.roundIds.indexOf(item.id) !== -1 ? 12 : 60;
    var groupScore = calcRoundGroup(item, ctx.roundIds);
    var antiSticky = chronicMul < 0.9 ? clamp(70 + chronicMul * 25, 0, 100) : 95;
    var weekdayHits = ctx.weekdayCount[item.id] || 0;
    var weekdayScore = 50;
    if (ctx.weekdayTotal >= 5) {
      var expected = ctx.weekdayTotal / ctx.pool;
      weekdayScore = clamp(50 + (weekdayHits - expected) / Math.max(Math.sqrt(expected), 0.4) * 12, 0, 100);
    }

    var factors = [
      makeFactor("DaysSinceLast", "미출제기간", daysScore),
      makeFactor("AvgInterval", "평균간격 도래", avgFit),
      makeFactor("MonthPattern", "월별 패턴", monthScore),
      makeFactor("RecentCenterPattern", "최근 패턴", recentScore),
      makeFactor("MarkovNext", "직전 전이", markovScore),
      makeFactor("RotationBalance", "회전 균형", rotationScore),
      makeFactor("FamilyAffinity", "계열 전환", familyScore),
      makeFactor("RoundDup", "회차 중복억제", roundDupScore),
      makeFactor("GroupAffinity", "회차 계열", groupScore),
      makeFactor("GlobalFrequency", "출제빈도", freqScore),
      makeFactor("MaxGapPressure", "최장공백 압박", maxGapPressure),
      makeFactor("StickyTrap", "만성미출제 억제", antiSticky),
      makeFactor("DayOfWeek", "요일 경향", weekdayScore)
    ];
    var score = 0;
    for (i = 0; i < factors.length; i++) score += factors[i].weighted;

    var reason;
    if (roundDupScore <= 12) {
      reason = "이번 회차 이미 출제";
    } else {
      var rankedFactors = factors.slice().sort(function (a, b) { return b.weighted - a.weighted; });
      var labels = [];
      for (i = 0; i < rankedFactors.length && labels.length < 2; i++) {
        if (rankedFactors[i].key === "StickyTrap") continue;
        labels.push(rankedFactors[i].label);
      }
      reason = labels.join(" · ");
    }
    return { score: score, reason: reason, stats: s, factors: factors };
  }

  function predict(date, session) {
    if (!isExamDate(date)) return [];
    session = session || sessionForDate(date);
    var ctx = buildPredictContext(date, session);
    var boost = (state.calib && state.calib.boost) || {};
    var ranked = examItems().map(function (item) {
      var result = scoreItem(item, date, session, ctx);
      return {
        item: item,
        score: result.score + (boost[item.id] || 0),
        reason: result.reason,
        stats: result.stats,
        factors: result.factors
      };
    }).filter(function (row) { return row.score > -9000; })
      .sort(function (a, b) { return b.score - a.score; });
    if (!ranked.length) return ranked;
    var maxS = ranked[0].score;
    var temp = 16;
    var exps = ranked.map(function (row) { return Math.exp((row.score - maxS) / temp); });
    var sum = 0;
    var i;
    for (i = 0; i < exps.length; i++) sum += exps[i];
    var maxP = exps[0] / sum;
    ranked.forEach(function (row, idx) {
      row.pct = Math.max(8, Math.round(100 * (exps[idx] / sum) / maxP));
    });
    return ranked;
  }

  var calibBusy = false;

  function calibStamp() {
    return simpleHash(state.records.map(function (row) {
      return row.date + "\t" + row.session + "\t" + row.itemId;
    }).sort().join("|"));
  }

  function nudgeBoost(map, id, delta) {
    map[id] = clamp((map[id] || 0) + delta, -18, 18);
  }

  function applyCalibStep(ranked, actualId) {
    var rank = 0;
    var actualRow = null;
    var i;
    for (i = 0; i < ranked.length; i++) {
      if (ranked[i].item.id === actualId) {
        rank = i + 1;
        actualRow = ranked[i];
        break;
      }
    }
    if (!rank || !actualRow) return { rank: 0 };
    var lr = rank === 1 ? 0.04 : 0.12;
    var boost = state.calib.boost;
    nudgeBoost(boost, actualId, lr * (rank === 1 ? 1.2 : Math.min(rank, 8)));
    if (rank > 1) {
      for (i = 0; i < Math.min(3, ranked.length); i++) {
        if (ranked[i].item.id !== actualId) nudgeBoost(boost, ranked[i].item.id, -lr * (i === 0 ? 2.4 : 0.7));
      }
      var winner = ranked[0];
      var skip = { RoundDup: 1, StickyTrap: 1 };
      if (actualRow.factors && winner.factors) {
        var actualRaw = {};
        var winRaw = {};
        actualRow.factors.forEach(function (f) { actualRaw[f.key] = f.raw; });
        winner.factors.forEach(function (f) { winRaw[f.key] = f.raw; });
        Object.keys(FACTOR_WEIGHTS).forEach(function (key) {
          if (skip[key]) return;
          var d = (actualRaw[key] || 0) - (winRaw[key] || 0);
          var mul = state.calib.factorMul[key] || 1;
          state.calib.factorMul[key] = clamp(mul * (1 + lr * 0.0035 * d), 0.55, 1.65);
        });
      }
    }
    Object.keys(boost).forEach(function (id) { boost[id] *= 0.997; });
    return { rank: rank };
  }

  function runCalibration() {
    state.calib = emptyCalib(calibStamp());
    var rows = state.records.filter(function (row) { return isExamItemId(row.itemId); })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var i;
    for (i = 0; i < rows.length; i++) {
      var date = rows[i].date;
      if (uniqueSortedDates(priorRecords(date).filter(isScheduledExamRow)).length < 6) continue;
      var ranked = predict(date, rows[i].session);
      if (!ranked.length) continue;
      var step = applyCalibStep(ranked, rows[i].itemId);
      if (!step.rank) continue;
      state.calib.n += 1;
      if (step.rank === 1) state.calib.top1 += 1;
      if (step.rank <= 3) state.calib.top3 += 1;
      if (step.rank <= 5) state.calib.top5 += 1;
    }
    saveState();
  }

  function ensureCalibrated() {
    if (calibBusy) return;
    var stamp = calibStamp();
    if (state.calib && state.calib.stamp === stamp && state.calib.n >= 0) return;
    calibBusy = true;
    try { runCalibration(); }
    finally { calibBusy = false; }
  }

  function calibLine() {
    var c = state.calib;
    if (!c || c.n < 8) return "";
    var pct = function (n) { return Math.round(100 * n / c.n); };
    return "1위 적중 " + pct(c.top1) + "% · 3위 안 " + pct(c.top3) + "% · 시험일 " + c.n + "번";
  }

  function predictPath(date, session) {
    var inferred = inferSession(date);
    var q = [];
    if (date && date !== todayStr()) q.push("d=" + date);
    if (session && Number(session) !== Number(inferred)) q.push("r=" + Number(session));
    return q.length ? "/?" + q.join("&") : "/";
  }

  function parseHash() {
    var raw = location.hash.replace(/^#/, "") || "/";
    var split = raw.split("?");
    var path = split[0];
    var query = split[1] || "";
    return {
      parts: path.split("/").filter(Boolean),
      params: new URLSearchParams(query)
    };
  }

      '<p class="section-title">회차별 기록</p>' +

        note: existing.note || ""

    return {
      id: uid(),
      date: date,
      session: sessionForDate(date),
      itemId: blankItemForDate(date),
      note: ""
    };

  function renderEditor(isNew) {
    var parsed = parseHash();

    if (!isNew && !existing) {
      go("/log");

    }
    if (isBlankItemId(draft.itemId)) draft.itemId = blankItemForDate(draft.date);
    var dup = state.records.find(function (row) {
      return row.date === draft.date && row.id !== draft.id;
    });
    root.innerHTML =
      '<div class="topbar"><button class="ghost" data-go="/log">닫기</button><h2>' + (isNew ? "기출 입력" : "기출 수정") + '</h2><span class="ghost"></span></div>' +
      '<p class="lede">' + escapeHtml(state.site) + " · " + yearOf(draft.date) + "년 " + sessionLabel(draft.session) + " · 같은 회차에 날짜를 여러 개 넣을 수 있습니다</p>" +
      '<div class="stack">' +
        '<label class="field"><span>시험일</span><input id="f-date" type="date" value="' + draft.date + '"></label>' +

        '<div class="field"><span>출제 품목</span><div class="stack" id="f-items">' +
          ITEMS.filter(function (item) {
            if (item.id === "pending") return isFutureDate(draft.date);
            if (item.id === "unknown") return !isFutureDate(draft.date);
            return true;
          }).map(function (item) {
            return '<button type="button" class="choice' + (draft.itemId === item.id ? " on" : "") + '" data-item="' + item.id + '">' +
              escapeHtml(item.name) + "</button>";
          }).join("") + "</div></div>" +
        '<label class="field"><span>메모</span><input id="f-note" type="text" maxlength="80" placeholder="감독 전달, 배합 특이사항" value="' + escapeHtml(draft.note) + '"></label>' +
      "</div>" +
      (dup ? '<p class="warn">같은 날짜 기록이 이미 있습니다. 저장하면 그 날을 덮습니다.</p>' : "") +
      '<button class="btn btn-primary" id="save">저장</button>' +
      (isNew ? "" : '<button class="btn btn-danger" id="del">삭제</button>') +
      tabBar("log");
    bindNav();
    document.getElementById("f-date").addEventListener("change", function () {
      draft.date = this.value;
      if (isNew) draft.session = inferSession(draft.date);
      if (isBlankItemId(draft.itemId)) draft.itemId = blankItemForDate(draft.date);
      renderEditor(isNew);
    });
    document.getElementById("f-session").addEventListener("change", function () {
      draft.session = parseSession(this.value) || inferSession(draft.date);
      renderEditor(isNew);
    });
    document.getElementById("f-note").addEventListener("input", function () { draft.note = this.value; });
    document.getElementById("f-items").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-item]");
      if (!btn) return;
      draft.itemId = btn.getAttribute("data-item");
      renderEditor(isNew);
    });
    document.getElementById("save").addEventListener("click", function () {
      if (!draft.date || !draft.itemId) return;
      draft.session = parseSession(document.getElementById("f-session").value) || inferSession(draft.date);
      if (isBlankItemId(draft.itemId)) draft.itemId = blankItemForDate(draft.date);
      state.records = state.records.filter(function (row) {
        if (row.id === draft.id) return false;
        if (row.date === draft.date) return false;
        return true;
      });
      state.records.push({
        id: draft.id,
        date: draft.date,
        session: Number(draft.session),
        itemId: draft.itemId,
        note: (draft.note || "").trim()
      });
      var savedDate = draft.date;
      saveState();
      draft = null;
      go("/day/" + savedDate);
    });
    var del = document.getElementById("del");
    if (del) {
      del.addEventListener("click", function () {
        if (!confirm("이 날짜 기록을 지울까요?")) return;
        state.records = state.records.filter(function (row) { return row.id !== draft.id; });
        saveState();
        draft = null;
        go("/log");
      });
    }
  }

  function render() {
    normalizeRecords();
    ensureCalibrated();
    var parts = parseHash().parts;
    if (parts[0] === "month") return renderMonth();
    if (parts[0] === "day") return renderDay();
    if (parts[0] === "log") { draft = null; return renderLog(); }
    if (parts[0] === "upload") { draft = null; return renderUpload(); }
    if (parts[0] === "items") { draft = null; return renderItems(); }
    if (parts[0] === "settings") { draft = null; return renderSettings(); }
    if (parts[0] === "new") return renderEditor(true);
    if (parts[0] === "edit") return renderEditor(false);
    draft = null;
    renderHome();
  }

  window.addEventListener("hashchange", function () {
    try { render(); } catch (e) {}
  });
  try {
    render();
  } catch (e) {
    if (root) root.innerHTML = '<p class="lede">화면을 불러오지 못했습니다. 사파리에서 주소를 다시 열어 주세요.</p>';
  }

  if (/^https?:$/.test(location.protocol)) {
    ["기출_양식.txt", "기출.txt"].reduce(function (wait, name) {
      return wait.then(function () {
        return fetch(encodeURI(name) + "?v=" + APP_VERSION + "&t=" + Date.now(), { cache: "no-store" }).then(function (res) {
          if (!res.ok) return;
          return res.text().then(function (text) {
            if (importSeedFile(name, text)) render();
          });
        }).catch(function () {});
      });
    }, Promise.resolve());
  }
})();
  </script>
</body>
</html>
