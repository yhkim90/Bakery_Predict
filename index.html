<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="제과제빵 예상">
  <meta name="theme-color" content="#5C4033">
  <title>제과제빵 실기 예상</title>
  <style>
    :root {
      --bg: #f6f1ea;
      --surface: #fffcf7;
      --text: #3d2b22;
      --muted: #8a7364;
      --accent: #5c4033;
      --line: #e6d9cc;
      --danger: #9a3b2f;
      --ok: #3d6b4f;
      --warn: #8a5a20;
      --radius: 16px;
      --tap: 44px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 17px;
      line-height: 1.45;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; }
    .app { width: min(430px, 100%); margin: 0 auto; padding: 8px 20px 108px; }
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--line);
    }
    .tabbar button { min-height: 48px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .tabbar button.on { color: var(--accent); }
    .topbar { display: flex; align-items: center; min-height: var(--tap); gap: 8px; margin-bottom: 8px; }
    .topbar h1, .topbar h2 { flex: 1; margin: 0; font-size: 20px; font-weight: 700; text-align: center; }
    .ghost { min-width: 52px; min-height: var(--tap); color: var(--accent); font-weight: 600; font-size: 15px; }
    .ghost:disabled { opacity: 0.55; }
    .lede { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    .site { margin: 0 0 16px; color: var(--accent); font-size: 13px; font-weight: 700; }
    .card {
      padding: 14px 16px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--line);
    }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;
    }
    .stats .card { text-align: center; padding: 12px 8px; }
    .stats small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
    .stats strong { display: block; margin-top: 4px; font-size: 22px; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 52px; margin-top: 12px; border-radius: 999px; font-weight: 700;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #efe4d8; color: var(--accent); }
    .btn-danger { color: var(--danger); }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field span, .section-title { color: var(--muted); font-size: 13px; font-weight: 700; }
    .section-title { margin: 18px 0 8px; }
    input[type="text"], input[type="date"], input[type="month"], input[type="number"], input[type="file"], select, textarea {
      width: 100%; min-height: var(--tap); padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    }
    .lookup {
      display: grid; grid-template-columns: 52px minmax(0, 1fr) 72px 52px;
      gap: 6px; align-items: stretch; margin-bottom: 12px;
    }
    .lookup > .ghost {
      display: flex; align-items: center; justify-content: center;
      min-width: 0; padding: 0 4px; border-radius: 12px; background: #efe4d8;
    }
    .lookup .date-wrap, .lookup .round-wrap {
      position: relative; min-width: 0; overflow: hidden;
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    }
    .lookup .date-face, .lookup .round-face {
      min-height: var(--tap); display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; pointer-events: none;
    }
    .lookup .date-wrap input, .lookup .round-wrap input {
      position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0;
      margin: 0; padding: 0; opacity: 0.02; border: 0; border-radius: 12px;
      background: transparent; color: transparent; font-size: 16px;
    }
    .lookup .round-face { font-size: 15px; }
    textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
    .sample {
      margin: 0; padding: 12px 14px; border-radius: 12px; background: #efe4d8;
      color: var(--text); font-size: 13px; white-space: pre-wrap; word-break: break-all;
    }
    .ok { color: var(--ok); font-size: 14px; font-weight: 700; }
    .switch {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin: 0 0 16px; padding: 4px; border-radius: 12px; background: #efe4d8;
    }
    .switch button {
      flex: 1 1 22%; min-height: 40px; border-radius: 10px; font-weight: 700; color: var(--muted); font-size: 14px;
    }
    .switch button.on { background: var(--surface); color: var(--accent); }
    .rank {
      display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .rank:last-child { border-bottom: 0; }
    .rank.hit { background: #f4ebe2; margin: 0 -16px; padding-left: 16px; padding-right: 16px; border-radius: 12px; }
    .num {
      width: 28px; height: 28px; border-radius: 999px; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    }
    .num.dim { background: #efe4d8; color: var(--muted); }
    .rank small { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
    .bar { height: 6px; border-radius: 99px; background: #efe4d8; margin-top: 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .cal-head {
      display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-bottom: 8px;
    }
    .cal-head h2 { margin: 0; text-align: center; font-size: 18px; }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
    .week span { text-align: center; color: var(--muted); font-size: 12px; font-weight: 700; padding: 6px 0; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day {
      min-height: 54px; border-radius: 12px; padding: 4px 2px 6px;
      background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .day.on { background: var(--surface); border: 1px solid var(--line); }
    .day.plan { background: var(--surface); border: 1px dashed var(--accent); }
    .day.today { outline: 2px solid var(--accent); }
    .day.empty { visibility: hidden; }
    .day b { font-size: 13px; }
    .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--accent); }
    .dot.plan { background: transparent; box-shadow: inset 0 0 0 1.5px var(--accent); }
    .dot.skip { background: #d9cbbd; }
    .muted { color: var(--muted); font-size: 14px; }
    .warn { color: var(--warn); font-size: 13px; }
    .item-link {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 14px 0; text-align: left; border-bottom: 1px solid var(--line); width: 100%;
    }
    .item-link strong { display: block; }
    .item-link span { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
    .pill { display: inline-block; padding: 5px 10px; border-radius: 999px; background: #efe4d8; color: var(--accent); font-size: 12px; font-weight: 700; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .hidden { display: none; }
    .record {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .footer-actions { margin-top: 24px; display: flex; flex-direction: column; gap: 4px; }
    .footer-actions button { min-height: 40px; color: var(--muted); font-size: 14px; }
    .empty { padding: 28px 8px; text-align: center; color: var(--muted); }
    .choice {
      width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line);
      border-radius: 12px; background: var(--surface); min-height: 48px;
    }
    .choice.on { border-color: var(--accent); background: #efe4d8; font-weight: 700; }
    .rank { width: 100%; text-align: left; }
    .rank .pct { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
    .why { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    .why div { margin: 2px 0; }
    .metric { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .subject-switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      margin: 0 0 12px; padding: 4px; border-radius: 12px; background: #efe4d8;
    }
    .subject-switch button {
      min-height: 40px; border-radius: 10px; font-weight: 700; color: var(--muted); font-size: 15px;
    }
    .subject-switch button.on { background: var(--surface); color: var(--accent); }
    .actual {
      margin: 0 0 12px; padding: 10px 14px; border-radius: 12px;
      background: #efe4d8; color: var(--accent); font-weight: 700; font-size: 15px;
    }
    .actual.dim { font-weight: 600; color: var(--muted); }
    .lookup > .ghost:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>

  function pad(n) { return String(n).padStart(2, "0"); }

    return d.slice(0, 7);

    var p = str.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

    return Math.round((parseDate(b) - parseDate(a)) / 86400000);
  }

    return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) + " (" + WEEK[d.getDay()] + ")";
  }

  function shiftDate(str, days) {
    var d = parseDate(str);
    d.setDate(d.getDate() + days);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function shiftMonth(ym, delta) {
    var p = ym.split("-").map(Number);
    var d = new Date(p[0], p[1] - 1 + delta, 1);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1);
  }

  function monthLabel(ym) {
    var p = ym.split("-").map(Number);
    return p[0] + "년 " + p[1] + "월";
  }

  function daysInMonth(ym) {
    var p = ym.split("-").map(Number);
    return new Date(p[0], p[1], 0).getDate();
  }

  function firstWeekday(ym) {
    var p = ym.split("-").map(Number);
    return new Date(p[0], p[1] - 1, 1).getDay();

  var memoryStore = {};

  }
  function writeStore(key, value) {
    try { localStorage.setItem(key, value); }
    catch (e) { memoryStore[key] = value; }

    bag = bag || state;
    if (!bag.subjects) bag.subjects = { bread: defaultBag(), pastry: defaultBag() };
    if (!bag.subject) bag.subject = "bread";
    bag.subjects[bag.subject] = { site: bag.site, records: bag.records };
  }

  function loadState() {
    try {
      var raw = readStore(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed.subjects) {
        parsed.subjects = {
          bread: { site: parsed.site || "시험장 1곳", records: parsed.records || [] },
          pastry: defaultBag()
        };
        parsed.version = 2;
        parsed.subject = "bread";
      }
      if (!parsed.subjects.pastry) parsed.subjects.pastry = defaultBag();
      if (!parsed.subjects.bread) parsed.subjects.bread = defaultBag();
      activateSubject(parsed.subject || "bread", parsed);
      return parsed;
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    persistActive();
    writeStore(STORAGE_KEY, JSON.stringify(state));
  }

  function currentMeta() {
    return SUBJECTS[state.subject] || SUBJECTS.bread;
  }

  function currentItems() {
    return currentMeta().items;
  }

  function currentAliases() {
    var out = {};
    var key;
    for (key in SHARED_ALIASES) out[key] = SHARED_ALIASES[key];
    var extra = currentMeta().aliases || {};
    for (key in extra) out[key] = extra[key];
    return out;
  }

  function findItem(id) {
    return currentItems().find(function (item) { return item.id === id; });
  }

  function itemName(id) {
    var item = findItem(id);
    return item ? item.name : id;
  }

  function foldName(value) {
    return String(value || "")
      .replace(/\s+/g, "")
      .replace(/[()[\]{}·.,]/g, "")
      .replace(/빵류$/, "빵");
  }

  function resolveItem(name) {
    var folded = foldName(name);
    if (!folded) return null;
    var aliases = currentAliases();
    if (aliases[folded]) return aliases[folded];
    var exact = currentItems().find(function (item) { return foldName(item.name) === folded; });
    if (exact) return exact.id;
    var hits = currentItems().filter(function (item) {
      var n = foldName(item.name);
      return n.indexOf(folded) !== -1 || folded.indexOf(n) !== -1;
    });
    if (hits.length === 1) return hits[0].id;
    return null;
  }

  function parseLooseDate(value, yearHint) {
    var raw = String(value || "").trim();
    var m = raw.match(/^(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일?$/);
    if (!m) m = raw.match(/^(\d{4})[./-](\d{1,2})[./-](\d{1,2})$/);
    if (!m) m = raw.match(/^(\d{4})(\d{2})(\d{2})$/);
    if (!m) {
      m = raw.match(/^(\d{1,2})[./-](\d{1,2})$/);
      if (m) m = [m[0], String(yearHint || new Date().getFullYear()), m[1], m[2]];
    }
    if (!m) return "";
    var y = Number(m[1]);
    var mo = Number(m[2]);
    var d = Number(m[3]);
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return "";
    return y + "-" + pad(mo) + "-" + pad(d);
  }

  function parseSession(value) {
    var raw = String(value || "").trim();
    var m = raw.match(/(\d{1,3})/);
    if (!m) return 0;
    var n = Number(m[1]);
    return n >= 1 && n <= 366 ? n : 0;
  }

  function yearOf(date) {
    return String(date || "").slice(0, 4);
  }

  function lastSession(year) {
    var max = 0;
    state.records.forEach(function (row) {
      if (yearOf(row.date) === String(year) && row.session > max) max = row.session;
    });
    return max;
  }

  function recordsInRound(year, session) {
    return state.records
      .filter(function (row) {
        return yearOf(row.date) === String(year) && Number(row.session) === Number(session);
      })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }

  function inferSession(date) {
    var year = yearOf(date);
    var inYear = state.records.filter(function (row) { return yearOf(row.date) === year; });
    var spans = {};
    inYear.forEach(function (row) {
      if (!spans[row.session]) spans[row.session] = { min: row.date, max: row.date };
      if (row.date < spans[row.session].min) spans[row.session].min = row.date;
      if (row.date > spans[row.session].max) spans[row.session].max = row.date;
    });
    var key;
    for (key in spans) {
      if (date >= spans[key].min && date <= spans[key].max) return Number(key);
    }
    var before = inYear.filter(function (row) { return row.date <= date; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (before[0]) return before[0].session;
    return lastSession(year) || 1;
  }

  function sessionLabel(n) {
    return Number(n) + "회";
  }

  function examItems() {
    return currentItems().filter(function (item) { return !item.skip; });
  }

  function parseSubjectName(value) {
    var folded = foldName(value);
    if (folded.indexOf("제과") !== -1 || folded === "과자") return "pastry";
    if (folded.indexOf("제빵") !== -1) return "bread";
    return "";
  }

  function peekSubject(text) {
    var lines = String(text || "").replace(/^\uFEFF/, "").split(/\r?\n/);
    var i;
    for (i = 0; i < lines.length; i++) {
      var m = lines[i].trim().match(/^종목\s*[:：]\s*(.+)$/);
      if (m) return parseSubjectName(m[1]);
    }
    return "";
  }

  function parseTxtRecords(text, subjectHint) {
    var target = peekSubject(text) || subjectHint || state.subject;
    var prevSubject = state.subject;
    state.subject = target || prevSubject;
    var parsed;
    try {
      parsed = parseTxtRecordsInner(text);
    } finally {
      state.subject = prevSubject;
    }
    parsed.subject = parsed.subject || target || prevSubject;
    return parsed;
  }

  function parseTxtRecordsInner(text) {
    var lines = String(text || "").replace(/^\uFEFF/, "").split(/\r?\n/);
    var ok = [];
    var errors = [];
    var site = "";
    var subject = "";
    var lastSessionNo = 0;
    var yearHint = new Date().getFullYear();
    var dateToken = "(\\d{4}\\s*년\\s*\\d{1,2}\\s*월\\s*\\d{1,2}\\s*일?|\\d{4}[./-]\\d{1,2}[./-]\\d{1,2}|\\d{8}|\\d{1,2}[./-]\\d{1,2})";
    var dateRe = new RegExp(dateToken, "g");

    function isPlanText(value) {
      var folded = foldName(value);
      return !folded || /^(예정|예정일|예정일자|시험예정|시험일|일정|미정|대기)$/.test(folded);
    }

    function extractDates(raw) {
      var found = [];
      var m;
      dateRe.lastIndex = 0;
      while ((m = dateRe.exec(raw))) {
        var date = parseLooseDate(m[1], yearHint);
        if (date) {
          found.push(date);
          yearHint = Number(yearOf(date));
        }
      }
      return found;
    }

    function datesBetween(a, b) {
      var out = [];
      var cur = a;
      while (cur && b && cur <= b) {
        out.push(cur);
        cur = shiftDate(cur, 1);
        if (out.length > 45) break;
      }
      return out;
    }

    function addRow(date, session, itemText, note) {
      if (!date) return false;
      yearHint = Number(yearOf(date));
      if (!session) session = lastSessionNo;
      // 회차를 모르면 0. 날짜·품목만으로 빈도에는 넣는다.
      var itemId = "unknown";
      var extra = note || "";
      itemText = String(itemText || "").trim();
      if (itemText && !isPlanText(itemText)) {
        var resolved = resolveItem(itemText);
        if (resolved) itemId = resolved;
        else extra = extra ? extra + " " + itemText : itemText;
      }
      ok.push({
        id: uid(),
        date: date,
        session: session,
        itemId: itemId,
        note: extra
      });
      if (session) lastSessionNo = session;
      return true;
    }

    lines.forEach(function (line, idx) {
      var raw = line.trim();
      if (!raw || raw.charAt(0) === "#" || raw.indexOf("//") === 0) return;
      var siteMatch = raw.match(/^시험장\s*[:：]\s*(.+)$/);
      if (siteMatch) {
        site = siteMatch[1].trim();
        return;
      }
      var subjectMatch = raw.match(/^종목\s*[:：]\s*(.+)$/);
      if (subjectMatch) {
        subject = parseSubjectName(subjectMatch[1]);
        return;
      }
      var dates = extractDates(raw);
      if (/\s+[~\-–〜]\s+/.test(raw) && dates.length >= 2) {
        dates = datesBetween(dates[0], dates[dates.length - 1]);
      }
      var sessionMatch = raw.match(/(\d{1,3})\s*[회차]/);
      var session = sessionMatch ? parseSession(sessionMatch[1]) : lastSessionNo;
      var itemText = raw
        .replace(new RegExp(dateToken, "g"), " ")
        .replace(/(\d{1,3})\s*[회차]/g, " ")
        .replace(/[~\-–〜,，|/]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      if (!dates.length) {
        errors.push((idx + 1) + "행: 날짜를 읽지 못함");
        return;
      }
      dates.forEach(function (date) {
        addRow(date, session, itemText, "");
      });
    });
    return { records: ok, errors: errors, site: site, subject: subject };
  }

  function recordsToTxt() {
    var lines = [
      "종목: " + currentMeta().name,
      "시험장: " + state.site,
      "# 형식: 날짜  회차  품목",
      "# 회차를 모르면 날짜와 품목만 적어도 됩니다. 빈도 계산에는 들어갑니다.",
      "# 같은 회차에 시험일이 여러 날 있습니다.",
      "# 품목을 모르면 비우거나 미확인, 아직 안 본 날은 예정, 시험 없으면 미실시"
    ];
    state.records.slice().sort(function (a, b) {
      if (a.session !== b.session) return a.session - b.session;
      return a.date < b.date ? -1 : 1;
    }).forEach(function (row) {
      var line = row.session
        ? row.date + "\t" + row.session + "회\t" + itemName(row.itemId)
        : row.date + "\t" + itemName(row.itemId);
      if (row.note) line += "\t" + row.note;
      lines.push(line);
    });
    return lines.join("\n") + "\n";
  }

  function applyTxtImport(parsed, replaceAll, subjectId) {
    var target = subjectId || parsed.subject || state.subject;
    var prev = state.subject;
    persistActive();
    activateSubject(target);
    if (parsed.site) state.site = parsed.site;
    if (replaceAll) state.records = [];
    parsed.records.forEach(function (row) {
      var existing = state.records.find(function (cur) { return cur.date === row.date; });
      var incomingItem = findItem(row.itemId);
      var existingItem = existing ? findItem(existing.itemId) : null;
      if (existing && existingItem && !existingItem.skip && incomingItem && incomingItem.skip) return;
      state.records = state.records.filter(function (cur) {
        return cur.date !== row.date;
      });
      state.records.push(row);
    });
    persistActive();
    activateSubject(prev);
    saveState();
    hitCache = { key: "", value: null };
    if (window.BakeryPredict) BakeryPredict.resetFit();
  }

  function recordStatus(row) {
    var item = findItem(row.itemId);
    if (!item || item.id === "unknown") return row.date > todayStr() ? "plan" : "unknown";
    if (item.id === "none") return "skip";
    return "done";
  }

  function recordLabel(row) {
    var status = recordStatus(row);
    if (status === "plan") return "예정";
    if (status === "unknown") return "미확인";
    if (status === "skip") return "미실시";
    return itemName(row.itemId);
  }

  function downloadText(filename, text, type) {
    var blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function recordsOn(date) {
    return state.records
      .filter(function (row) { return row.date === date; })
      .sort(function (a, b) { return a.session - b.session; });
  }

  function isExamPredictDate(date) {
    return recordsOn(date).some(function (row) {
      return row.itemId !== "none" && Number(row.session) > 0;
    });
  }

  function allExamDates() {
    var seen = {};
    var dates = [];
    state.records.forEach(function (row) {
      if (row.itemId === "none" || Number(row.session) < 1 || seen[row.date]) return;
      seen[row.date] = true;
      dates.push(row.date);
    });
    dates.sort();
    return dates;
  }

  function prevExamDate(date) {
    var prev = "";
    allExamDates().forEach(function (d) {
      if (d < date) prev = d;
    });
    return prev;
  }

  function nextExamDate(date) {
    var dates = allExamDates();
    var i;
    for (i = 0; i < dates.length; i++) {
      if (dates[i] > date) return dates[i];
    }
    return "";
  }

  function nearestExamDate(date) {
    var dates = allExamDates();
    if (!dates.length) return "";
    if (dates.indexOf(date) !== -1) return date;
    var i;
    for (i = 0; i < dates.length; i++) {
      if (dates[i] >= date) return dates[i];
    }
    return dates[dates.length - 1];
  }

  function resolveExamDate(date) {
    if (isExamPredictDate(date)) return date;
    return nearestExamDate(date) || date;
  }

  function recordsInMonth(ym) {
    return state.records
      .filter(function (row) { return monthStr(row.date) === ym; })
      .sort(function (a, b) {
        if (a.date === b.date) return a.session - b.session;
        return a.date < b.date ? -1 : 1;
      });
  }

  function priorRecords(date, session) {
    return state.records.filter(function (row) {
      if (row.date < date) return true;
      if (row.date === date && session && row.session !== session) return true;
      return false;
    });
  }

  function statsFor(itemId, date, session) {
    var prior = priorRecords(date, session);
    var hits = prior.filter(function (row) { return row.itemId === itemId; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var last = hits[0] || null;
    var ym = monthStr(date);
    var monthHits = hits.filter(function (row) { return monthStr(row.date) === ym; }).length;
    var recent30 = hits.filter(function (row) { return daysBetween(row.date, date) <= 30; }).length;
    var roundHits = session
      ? hits.filter(function (row) {
          return yearOf(row.date) === yearOf(date) && Number(row.session) === Number(session);
        }).length
      : 0;
    var roundLast = session
      ? hits.find(function (row) {
          return yearOf(row.date) === yearOf(date) && Number(row.session) === Number(session);
        })
      : null;
    var sameDay = recordsOn(date).some(function (row) {
      return row.itemId === itemId;
    });
    var freqYear = String(Number(yearOf(date)) - 1);
    var yearHits = hits.filter(function (row) { return yearOf(row.date) === freqYear; }).length;
    if (!yearHits && hits.length) {
      yearHits = hits.filter(function (row) { return daysBetween(row.date, date) <= 366; }).length;
      freqYear = "";
    }
    var gap = last ? daysBetween(last.date, date) : null;
    return {
      last: last,
      gap: gap,
      total: hits.length,
      yearHits: yearHits,
      yearLabel: freqYear ? freqYear + "년" : "1년",
      monthHits: monthHits,
      recent30: recent30,
      roundHits: roundHits,
      roundLast: roundLast,
      sameDay: sameDay
    };
  }

  function predict(date, session) {
    if (!isExamPredictDate(date)) return [];
    session = session || inferSession(date);
    if (!window.BakeryPredict) return [];
    var actualIds = {};
    recordsOn(date).forEach(function (row) {
      if (row.itemId && row.itemId !== "unknown" && row.itemId !== "none") actualIds[row.itemId] = true;
    });
    return BakeryPredict.predict(state.records, currentItems(), date, session)
      .map(function (row, i) {
        return {
          item: row.item,
          id: row.id,
          rank: i + 1,
          score: row.score,
          prob: row.prob,
          pct: row.pct,
          actual: !!actualIds[row.id],
          reason: row.pct.toFixed(1) + "% · 상대 예측확률",
          why: row.why,
          feat: row.feat
        };
      });
  }

  function topRanks(ranked, n) {
    var top = ranked.slice(0, n);
    ranked.forEach(function (row) {
      if (row.actual && top.indexOf(row) === -1) top.push(row);
    });
    return top;
  }

  var hitCache = { key: "", value: null };
  var hitPaintToken = 0;

  function hitRateKey(untilDate) {
    var n = state.records.length;
    var last = n ? state.records[n - 1] : null;
    return "remain-yprev|" + state.subject + "|" + untilDate + "|" + n + "|" + (last ? last.date + ":" + last.itemId + ":" + last.session : "");
  }

  function labeledCountUntil(untilDate) {
    return state.records.filter(function (row) {
      if (row.date > untilDate) return false;
      var item = findItem(row.itemId);
      return row.itemId && (!item || !item.skip);
    }).length;
  }

  function hitRateUntil(untilDate) {
    var n = state.records.length;
    var key = hitRateKey(untilDate);
    if (hitCache.key === key && hitCache.value) return hitCache.value;
    var empty = { n: 0, top1: 0, top3: 0, top5: 0, labeled: labeledCountUntil(untilDate) };
    if (!window.BakeryPredict || !window.BakeryPredict.walkForward) {
      empty.missing = "engine";
      return empty;
    }
    if (!n) return empty;
    try {
      var subset = state.records.filter(function (row) {
        return row.date <= untilDate && row.itemId !== "none";
      });
      var m = BakeryPredict.walkForward(subset, currentItems(), "remain", BakeryPredict.DEFAULT_W);
      var value = {
        n: m.n || 0,
        top1: m.top1 || 0,
        top3: m.top3 || 0,
        top5: m.top5 || 0,
        labeled: empty.labeled
      };
      hitCache = { key: key, value: value };
      return value;
    } catch (e) {
      empty.error = String(e && e.message ? e.message : e);
      return empty;
    }
  }

  function fmtHit(v) {
    return (v * 100).toFixed(0) + "%";
  }

  function hitRateCardsHtml(hit) {
    if (!hit || !hit.n) {
      return '<div class="card"><small>오늘까지 1위</small><strong>-</strong></div>' +
        '<div class="card"><small>3위 안</small><strong>-</strong></div>' +
        '<div class="card"><small>검증 일수</small><strong>-</strong></div>';
    }
    return '<div class="card"><small>오늘까지 1위</small><strong>' + fmtHit(hit.top1) + "</strong></div>" +
      '<div class="card"><small>3위 안</small><strong>' + fmtHit(hit.top3) + "</strong></div>" +
      '<div class="card"><small>검증 일수</small><strong>' + hit.n + "</strong></div>";
  }

  function hitRateLine(hit) {
    if (hit && hit.error) return "적중률을 계산하지 못했습니다. 새로고침을 눌러 주세요.";
    if (!window.BakeryPredict || !window.BakeryPredict.walkForward) {
      return "prediction.js를 함께 올려야 적중률이 나옵니다.";
    }
    if (!state.records.length) return "기출이 아직 없어 적중률을 계산할 수 없습니다. 새로고침으로 기출 TXT를 다시 불러 보세요.";
    var labeledN = hit && hit.labeled != null ? hit.labeled : labeledCountUntil(todayStr());
    if (!hit || !hit.n) {
      if (labeledN <= 20) return "확정 기출이 " + labeledN + "일입니다. 검증은 20일 이후부터입니다.";
      return "오늘까지 맞춰볼 확정 기출이 아직 부족합니다.";
    }
    return "미실시는 빼고, 확정 시험일만 회차 잔여+공백 로직으로 맞춰 본 값입니다.";
  }

  function fillHitRate(untilDate) {
    var token = ++hitPaintToken;
    function paint(hit) {
      if (token !== hitPaintToken) return;
      var stats = document.getElementById("hit-stats");
      if (stats) stats.innerHTML = hitRateCardsHtml(hit);
      var line = document.getElementById("hit-lede");
      if (line) line.textContent = hitRateLine(hit);
    }
    var key = hitRateKey(untilDate);
    if (hitCache.key === key && hitCache.value && hitCache.value.n) {
      paint(hitCache.value);
      return;
    }
    setTimeout(function () { paint(hitRateUntil(untilDate)); }, 0);
  }

  function loadRemoteTxt() {
    if (!/^https?:$/.test(location.protocol)) return Promise.resolve(false);
    var changed = false;
    var jobs = [];
    ["bread", "pastry"].forEach(function (id) {
      SUBJECTS[id].files.forEach(function (name) {
        jobs.push({ subject: id, name: name });
      });
    });
    return jobs.reduce(function (wait, job) {
      return wait.then(function () {
        return fetch(encodeURI(job.name) + "?t=" + Date.now(), { cache: "no-store" }).then(function (res) {
          if (!res.ok) return;
          return res.text().then(function (text) {
            var parsed = parseTxtRecords(text, job.subject);
            if (!parsed.records.length) return;
            applyTxtImport(parsed, false, parsed.subject || job.subject);
            changed = true;
          });
        }).catch(function () {});
      });
    }, Promise.resolve()).then(function () { return changed; });
  }

  function refreshApp() {
    var btn = document.getElementById("refresh-app");
    if (btn) {
      btn.disabled = true;
      btn.textContent = "불러오는 중";
    }
    hitCache = { key: "", value: null };
    hitPaintToken += 1;
    if (window.BakeryPredict && BakeryPredict.resetFit) BakeryPredict.resetFit();
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      location.replace(location.pathname + "?r=" + Date.now() + (location.hash || ""));
    }
    loadRemoteTxt().then(finish, finish);
    setTimeout(finish, 8000);
  }

  function bindRefresh() {
    var btn = document.getElementById("refresh-app");
    if (!btn) return;
    btn.addEventListener("click", refreshApp);
  }

  function parseHash() {
    var raw = location.hash.replace(/^#/, "") || "/";
    var split = raw.split("?");
    var path = split[0];
    var query = split[1] || "";
    return {
      parts: path.split("/").filter(Boolean),
      params: new URLSearchParams(query)
    };
  }

  function go(hash) { location.hash = hash; }

  var lastPredictPath = "/";

  function predictPath(date, session) {
    var q = ["s=" + state.subject];
    if (date) q.push("d=" + date);
    if (session) q.push("r=" + Number(session));
    return "/?" + q.join("&");
  }

  function subjectSwitchHtml() {
    return '<div class="subject-switch">' +
      '<button type="button" class="' + (state.subject === "bread" ? "on" : "") + '" data-subject="bread">제빵</button>' +
      '<button type="button" class="' + (state.subject === "pastry" ? "on" : "") + '" data-subject="pastry">제과</button>' +
      "</div>";
  }

  function bindSubject() {
    root.querySelectorAll("[data-subject]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-subject");
        if (!SUBJECTS[id] || id === state.subject) return;
        persistActive();
        activateSubject(id);
        saveState();
        hitCache = { key: "", value: null };
        var parsed = parseHash();
        var path = parsed.parts.length ? "/" + parsed.parts.join("/") : "/";
        parsed.params.set("s", id);
        var qs = parsed.params.toString();
        go(path + (qs ? "?" + qs : ""));
      });
    });
  }

  function actualBannerHtml(date, session) {
    var rows = recordsOn(date);
    var today = todayStr();
    if (!rows.length) {
      return date > today
        ? '<div class="actual dim">출제 : 진행 전</div>'
        : '<div class="actual dim">출제 : 기록 없음</div>';
    }
    var row = rows[0];
    var status = recordStatus(row);
    if (status === "plan") return '<div class="actual dim">출제 : 진행 전</div>';
    if (status === "unknown") return '<div class="actual dim">출제 : 미확인</div>';
    if (status === "skip") return '<div class="actual dim">출제 : 미실시</div>';
    var rank = 0;
    if (window.BakeryPredict) {
      var ranks = BakeryPredict.predict(state.records, currentItems(), date, session);
      var i;
      for (i = 0; i < ranks.length; i++) {
        if (ranks[i].id === row.itemId) { rank = i + 1; break; }
      }
    }
    return '<div class="actual">출제 : ' + escapeHtml(itemName(row.itemId)) +
      (rank ? " (예상 " + rank + "위)" : "") + "</div>";
  }

  function dateNavHtml(date, roundNo) {
    var prev = prevExamDate(date);
    var next = nextExamDate(date);
    return '<div class="lookup">' +
      '<button class="ghost" type="button" id="prev-day"' + (prev ? "" : " disabled") + ">이전</button>" +
      '<div class="date-wrap">' +
        '<div class="date-face">' + escapeHtml(date.replace(/-/g, ".")) + "</div>" +
        '<input id="home-date" type="date" value="' + date + '">' +
      "</div>" +
      '<div class="round-wrap">' +
        '<div class="round-face">' + sessionLabel(roundNo) + "</div>" +
        '<input id="home-round" type="number" min="1" max="366" value="' + roundNo + '">' +
      "</div>" +
      '<button class="ghost" type="button" id="next-day"' + (next ? "" : " disabled") + ">다음</button>" +
      "</div>";
  }

  function tabBar(active) {
    var s = "?s=" + state.subject;
    return '<nav class="tabbar">' +
      '<button type="button" class="' + (active === "predict" ? "on" : "") + '" data-go="' + lastPredictPath + '">예상</button>' +
      '<button type="button" class="' + (active === "month" ? "on" : "") + '" data-go="/month' + s + '">월별</button>' +
      '<button type="button" class="' + (active === "log" ? "on" : "") + '" data-go="/log' + s + '">기록</button>' +
      '<button type="button" class="' + (active === "items" ? "on" : "") + '" data-go="/items' + s + '">품목</button>' +
      "</nav>";
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  var root = document.getElementById("app");
  var state = loadState();
  saveState();
  var draft = null;

  function bindNav() {
    root.querySelectorAll("[data-go]").forEach(function (el) {
      el.addEventListener("click", function () { go(el.getAttribute("data-go")); });
    });
    bindSubject();
  }

  function renderHome() {
    var parsed = parseHash();
    var requested = parseLooseDate(parsed.params.get("d")) || todayStr();
    var date = resolveExamDate(requested);
    var pinnedRound = parseSession(parsed.params.get("r"));
    if (date !== requested) {
      go(predictPath(date, pinnedRound || inferSession(date)));
      return;
    }
    var year = yearOf(date);
    var roundNo = pinnedRound || inferSession(date);
    lastPredictPath = predictPath(date, pinnedRound || roundNo);
    var ranked = predict(date, roundNo);
    var monthRows = recordsInMonth(monthStr(date));
    var unique = {};
    monthRows.forEach(function (row) {
      var item = findItem(row.itemId);
      if (item && !item.skip) unique[row.itemId] = true;
    });
    var top = topRanks(ranked, 5);
    var latest = lastSession(year);
    var roundRows = recordsInRound(year, roundNo);
    var examRoundN = roundRows.filter(function (row) { return row.itemId !== "none"; }).length;
    var today = todayStr();
    var todayExam = resolveExamDate(today);
    var examDay = isExamPredictDate(date);
    root.innerHTML =
      '<div class="topbar"><button class="ghost" type="button" id="refresh-app">새로고침</button><h1>' + currentMeta().name + ' 예상</h1><button class="ghost" data-go="/settings">시험장</button></div>' +
      subjectSwitchHtml() +
      '<p class="site">' + escapeHtml(state.site) + " · " + currentMeta().name + " · " + year + "년 " + (latest ? sessionLabel(latest) : "") + "</p>" +
      dateNavHtml(date, roundNo) +
      actualBannerHtml(date, roundNo) +
      '<p class="lede">' + formatKor(date) + " 예상 · " + sessionLabel(roundNo) +
      (date === todayExam ? "" : ' · <button class="ghost" type="button" data-go="' + predictPath(todayExam, inferSession(todayExam)) + '" style="min-width:auto;display:inline;padding:0">오늘로 이동</button>') +
      "</p>" +
      '<div class="stats">' +
        '<div class="card"><small>이번 회차</small><strong>' + sessionLabel(roundNo) + "</strong></div>" +
        '<div class="card"><small>이번 회차 시험일</small><strong>' + examRoundN + "</strong></div>" +
        '<div class="card"><small>이번 달 품목</small><strong>' + Object.keys(unique).length + "</strong></div>" +
      "</div>" +
      '<p class="lede">미실시는 건너뜁니다. 직전 해(제빵은 2025년) 출제 빈도를 기준으로, 거의 안 나온 품목은 예상에 올리지 않습니다.</p>' +
      (!state.records.length
        ? '<div class="empty card">아직 기출이 없습니다. 회차와 날짜를 넣으면 예상이 생깁니다.</div>'
        : examDay
          ? renderRankList(top)
          : '<div class="empty card">시험 없는 날입니다. 이전/다음으로 시험일로 이동하세요.</div>') +
      '<p class="section-title">오늘까지 적중률</p>' +
      '<div class="stats" id="hit-stats">' +
        '<div class="card"><small>오늘까지 1위</small><strong>…</strong></div>' +
        '<div class="card"><small>3위 안</small><strong>…</strong></div>' +
        '<div class="card"><small>검증 일수</small><strong>…</strong></div>' +
      "</div>" +
      '<p class="lede" id="hit-lede">미실시는 빼고, 확정 시험일만 회차 잔여+공백 로직으로 맞춰 본 값입니다.</p>' +
      '<button class="btn btn-primary" data-go="/day/' + date + '?r=' + roundNo + '">이 날짜 자세히</button>' +
      '<button class="btn btn-secondary" data-go="/new?date=' + date + '">기출 입력</button>' +
      tabBar("predict");
    bindNav();
    bindRefresh();
    bindWhy();
    document.getElementById("prev-day").addEventListener("click", function () {
      var prev = prevExamDate(date);
      if (prev) go(predictPath(prev, pinnedRound));
    });
    document.getElementById("next-day").addEventListener("click", function () {
      var next = nextExamDate(date);
      if (next) go(predictPath(next, pinnedRound));
    });
    document.getElementById("home-date").addEventListener("change", function () {
      var next = resolveExamDate(parseLooseDate(this.value));
      if (!next) return;
      go(predictPath(next, pinnedRound));
    });
    document.getElementById("home-round").addEventListener("change", function () {
      var n = parseSession(this.value);
      if (!n) return;
      go(predictPath(date, n));
    });
    fillHitRate(today);
  }

  function whyHtml(why) {
    if (!why) return "";
    return "<div>이번 회차: " + why.round + "</div>" +
      "<div>최근 1년: " + (why.year || "-") + "</div>" +
      "<div>공백: " + why.gap + "</div>" +
      "<div>회차 첫날: " + (why.opener || "-") + "</div>" +
      "<div>기본 출제율: " + why.base + "</div>" +
      "<div>최근 출제빈도: " + why.recent + "</div>";
  }

  function renderRankList(rows) {
    if (!rows.length) return '<div class="empty card">같은 날 이미 나온 품목을 제외하면 남은 후보가 없습니다.</div>';
    return '<div class="card" id="rank-box">' + rows.map(function (row, i) {
      var rankNo = row.rank || (i + 1);
      var bar = Math.max(6, Math.round((row.prob || 0) * 100 * 3));
      return '<button type="button" class="rank' + (row.actual ? " hit" : "") + '" data-why="' + i + '">' +
        '<div class="num' + (rankNo > 3 ? " dim" : "") + '">' + rankNo + "</div>" +
        "<div><strong>" + escapeHtml(row.item.name) + "</strong><small>" +
        (row.pct != null ? row.pct.toFixed(1) : "") + "% · 상대 예측확률" +
        (row.actual ? " · 출제" : "") + "</small>" +
        '<div class="bar"><i style="width:' + Math.min(100, bar) + '%"></i></div>' +
        '<div class="why hidden" id="why-' + i + '">' + whyHtml(row.why) + "</div></div>" +
        '<span class="pct">' + (row.actual ? "출제" : (row.pct != null ? row.pct.toFixed(1) + "%" : "")) + "</span>" +
        "</button>";
    }).join("") + "</div>";
  }

  function bindWhy() {
    var box = document.getElementById("rank-box");
    if (!box) return;
    box.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-why]");
      if (!btn) return;
      var pane = document.getElementById("why-" + btn.getAttribute("data-why"));
      if (pane) pane.classList.toggle("hidden");
    });
  }

  function renderDay() {
    var parsed = parseHash();
    var date = parsed.parts[1] || todayStr();
    var actual = recordsOn(date);
    var session = parsed.params.get("r") ? parseSession(parsed.params.get("r")) : (actual.length ? actual[0].session : inferSession(date));
    var ranked = predict(date, session);
    var top = topRanks(ranked, 5);
    var roundRows = recordsInRound(yearOf(date), session);
    var used = {};
    var unknownCount = 0;
    var skipCount = 0;
    roundRows.forEach(function (row) {
      if (row.itemId === "unknown") unknownCount += 1;
      else if (row.itemId === "none") skipCount += 1;
      else used[row.itemId] = true;
    });
    var actualHtml = actual.length
      ? '<div class="card">' + actual.map(function (row) {
          return '<div class="record"><div><strong>' + yearOf(row.date) + "년 " + sessionLabel(row.session) + " · " + escapeHtml(recordLabel(row)) + "</strong>" +
            (row.note ? '<div class="muted">' + escapeHtml(row.note) + "</div>" : "") +
            '</div><button class="ghost" data-go="/edit/' + row.id + '">수정</button></div>';
        }).join("") + "</div>"
      : '<p class="muted">이 날짜 확정 기출은 아직 없습니다.</p>';

    lastPredictPath = predictPath(date, session);
    root.innerHTML =
      '<div class="topbar"><button class="ghost" data-go="' + lastPredictPath + '">닫기</button><h2>' + currentMeta().name + ' 일자</h2><button class="ghost" data-go="/new?date=' + date + '">입력</button></div>' +
      subjectSwitchHtml() +
      '<p class="site">' + escapeHtml(state.site) + " · 같은 회차에 시험일 여러 날</p>" +
      dateNavHtml(date, session) +
      actualBannerHtml(date, session) +
      '<p class="lede" style="margin-top:0">' + formatKor(date) + " · " + sessionLabel(session) + " · 시험일 " +
      roundRows.filter(function (row) { return row.itemId !== "none"; }).length + "날</p>" +
      '<p class="section-title">이 날짜</p>' + actualHtml +
      '<p class="section-title">상대 예측확률</p>' +
      (isExamPredictDate(date)
        ? renderRankList(top)
        : '<div class="empty card">시험 없는 날이라 예상을 하지 않습니다.</div>') +
      '<p class="muted" style="margin-top:14px">이번 회차 미확인 ' + unknownCount + " · 미실시 " + skipCount + "</p>" +
      '<p class="section-title">이번 회차 확인 품목</p>' +
      (Object.keys(used).length
        ? '<div class="pills">' + Object.keys(used).map(function (id) { return '<span class="pill">' + escapeHtml(itemName(id)) + "</span>"; }).join("") + "</div>"
        : '<p class="muted">아직 없습니다.</p>') +
      tabBar("predict");
    bindNav();
    bindWhy();
    document.getElementById("prev-day").addEventListener("click", function () {
      var prev = prevExamDate(date);
      if (prev) go("/day/" + prev + "?s=" + state.subject + "&r=" + session);
    });
    document.getElementById("next-day").addEventListener("click", function () {
      var next = nextExamDate(date);
      if (next) go("/day/" + next + "?s=" + state.subject + "&r=" + session);
    });
    document.getElementById("home-date").addEventListener("change", function () {
      var next = resolveExamDate(parseLooseDate(this.value));
      if (!next) return;
      go("/day/" + next + "?s=" + state.subject + "&r=" + session);
    });
    document.getElementById("home-round").addEventListener("change", function () {
      var n = parseSession(this.value);
      if (!n) return;
      go("/day/" + date + "?r=" + n);
    });
  }

  function renderMonth() {
    var parsed = parseHash();
    var ym = parsed.parts[1] || monthStr(todayStr());
    var rows = recordsInMonth(ym);
    var byDate = {};
    rows.forEach(function (row) {
      if (!byDate[row.date]) byDate[row.date] = [];
      byDate[row.date].push(row);
    });
    var used = {};
    rows.forEach(function (row) {
      var item = findItem(row.itemId);
      if (item && !item.skip) used[row.itemId] = true;
    });
    var missing = examItems().filter(function (item) { return !used[item.id]; });
    var start = firstWeekday(ym);
    var count = daysInMonth(ym);
    var cells = [];
    var i;
    for (i = 0; i < start; i++) cells.push('<button class="day empty" type="button"></button>');
    for (i = 1; i <= count; i++) {
      var date = ym + "-" + pad(i);
      var has = byDate[date];
      var status = has ? recordStatus(has[0]) : "";
      var cls = "day";
      if (has) cls += status === "plan" ? " plan" : " on";
      if (date === todayStr()) cls += " today";
      var mark = "";
      if (status === "done") mark = '<span class="dot"></span>';
      else if (status === "plan" || status === "unknown") mark = '<span class="dot plan"></span>';
      else if (status === "skip") mark = '<span class="dot skip"></span>';
      cells.push(
        '<button class="' + cls + '" type="button" data-go="/day/' + date + '"><b>' + i + "</b>" +
        mark + "</button>"
      );
    }

    root.innerHTML =
      '<div class="topbar"><button class="ghost" type="button" id="refresh-app">새로고침</button><h1>' + currentMeta().name + ' 월별</h1><button class="ghost" data-go="/settings">시험장</button></div>' +
      subjectSwitchHtml() +
      '<p class="site">' + escapeHtml(state.site) + "</p>" +
      '<div class="cal-head">' +
        '<button class="ghost" data-go="/month/' + shiftMonth(ym, -1) + '">이전</button>' +
        "<h2>" + monthLabel(ym) + "</h2>" +
        '<button class="ghost" data-go="/month/' + shiftMonth(ym, 1) + '">다음</button>' +
      "</div>" +
      '<div class="stats">' +
        '<div class="card"><small>이달 회차</small><strong>' + (function () {
          if (!rows.length) return "-";
          var nums = rows.map(function (row) { return row.session; });
          var lo = Math.min.apply(null, nums);
          var hi = Math.max.apply(null, nums);
          return lo === hi ? sessionLabel(lo) : lo + "–" + hi + "회";
        }()) + "</strong></div>" +
        '<div class="card"><small>출제 품목</small><strong>' + Object.keys(used).length + "</strong></div>" +
        '<div class="card"><small>미출제</small><strong>' + missing.length + "</strong></div>" +
      "</div>" +
      '<div class="week">' + WEEK.map(function (w) { return "<span>" + w + "</span>"; }).join("") + "</div>" +
      '<div class="days">' + cells.join("") + "</div>" +
      '<p class="section-title">이번 달 나온 품목</p>' +
      (Object.keys(used).length
        ? '<div class="pills">' + Object.keys(used).map(function (id) { return '<span class="pill">' + escapeHtml(itemName(id)) + "</span>"; }).join("") + "</div>"
        : '<p class="muted">이달 기록이 없습니다.</p>') +
      '<p class="section-title">이번 달 아직 안 나온 품목</p>' +
      (missing.length
        ? '<div class="pills">' + missing.map(function (item) { return '<span class="pill">' + escapeHtml(item.name) + "</span>"; }).join("") + "</div>"
        : '<p class="muted">이달 공개 20종이 모두 한 번 이상 나왔습니다.</p>') +
      '<p class="section-title">회차별 기록</p>' +
      (rows.length ? '<div class="card">' + rows.map(function (row) {
        return '<div class="record"><div><strong>' + sessionLabel(row.session) + " · " + row.date.slice(8) + "일</strong>" +
          '<div class="muted">' + escapeHtml(recordLabel(row)) + "</div></div>" +
          '<button class="ghost" data-go="/edit/' + row.id + '">수정</button></div>';
      }).join("") + "</div>" : '<div class="empty card">이달 기록이 없습니다.</div>') +
      tabBar("month");
    bindNav();
    bindRefresh();
  }

  function renderLog() {
    var rows = state.records.slice().sort(function (a, b) {
      if (a.date === b.date) return b.session - a.session;
      return a.date < b.date ? 1 : -1;
    });
    root.innerHTML =
      '<div class="topbar"><button class="ghost" type="button" id="refresh-app">새로고침</button><h1>' + currentMeta().name + ' 기록</h1><button class="ghost" data-go="/new">추가</button></div>' +
      subjectSwitchHtml() +
      '<p class="lede">' + escapeHtml(state.site) + " · 같은 회차에 시험일이 여러 날 있습니다. " + yearOf(todayStr()) + "년은 " + (lastSession(yearOf(todayStr())) || 0) + "회까지 있습니다.</p>" +
      (rows.length ? '<div class="card">' + rows.map(function (row) {
        return '<button class="item-link" data-go="/edit/' + row.id + '"><div><strong>' + sessionLabel(row.session) + " · " + formatKor(row.date) + "</strong><span>" +
          escapeHtml(recordLabel(row)) + '</span></div><span class="pill">수정</span></button>';
      }).join("") + "</div>" : '<div class="empty card">메모장 TXT로 한 번에 넣거나, 시험 후 차수를 직접 입력하면 됩니다.</div>') +
      '<button class="btn btn-primary" data-go="/new">한 건 입력</button>' +
      '<button class="btn btn-secondary" data-go="/upload">TXT 일괄 넣기</button>' +
      tabBar("log");
    bindNav();
    bindRefresh();
  }

  function renderItems() {
    var q = (lastPredictPath.split("?")[1] || "");
    var params = new URLSearchParams(q);
    var date = parseLooseDate(params.get("d")) || todayStr();
    var session = parseSession(params.get("r")) || inferSession(date);
    var ranked = predict(date, session);
    var byId = {};
    ranked.forEach(function (row, i) { byId[row.item.id] = { rank: i + 1, row: row }; });
    var list = examItems().slice().sort(function (a, b) {
      var ra = byId[a.id] ? byId[a.id].rank : 999;
      var rb = byId[b.id] ? byId[b.id].rank : 999;
      return ra - rb;
    });
    root.innerHTML =
      '<div class="topbar"><button class="ghost" type="button" id="refresh-app">새로고침</button><h1>' + currentMeta().name + ' 품목</h1><span class="ghost"></span></div>' +
      subjectSwitchHtml() +
      '<p class="lede">' + formatKor(date) + " 예상 순위 순입니다. 직전 해 출제 횟수가 같이 보입니다.</p>" +
      '<p class="lede" id="hit-lede">오늘까지 적중률을 계산하는 중…</p>' +
      '<div class="card">' + list.map(function (item) {
          var info = byId[item.id];
          var s = statsFor(item.id, date, session);
          var last = s.last ? s.last.date : "기록 없음";
          return '<div class="item-link"><div><strong>' + escapeHtml(item.name) + "</strong><span>" +
            (s.yearLabel || "1년") + " " + s.yearHits + "회 · 누적 " + s.total + "회</span></div>" +
            '<span class="pill">' + (info ? info.rank + "위" : "-") + "</span></div>";
        }).join("") + "</div>" +
      tabBar("items");
    bindNav();
    bindRefresh();
    fillHitRate(todayStr());
  }

  function editorState(existing) {
    if (existing) {
      return {
        id: existing.id,
        date: existing.date,
        session: existing.session,
        itemId: existing.itemId,
        note: existing.note || ""
      };
    }
    var parsed = parseHash();
    var date = parsed.params.get("date") || todayStr();
    return {
      id: uid(),
      date: date,
      session: inferSession(date),
      itemId: "unknown",
      note: ""
    };
  }

  function renderEditor(isNew) {
    var parsed = parseHash();
    var existing = isNew ? null : state.records.find(function (row) { return row.id === parsed.parts[1]; });
    if (!isNew && !existing) {
      go("/log");
      return;
    }
    if (!draft || draft._mode !== (isNew ? "new" : existing.id)) {
      draft = Object.assign(editorState(existing), { _mode: isNew ? "new" : existing.id });
    }
    var dup = state.records.find(function (row) {
      return row.date === draft.date && row.id !== draft.id;
    });
    root.innerHTML =
      '<div class="topbar"><button class="ghost" data-go="/log">닫기</button><h2>' + currentMeta().name + (isNew ? " 입력" : " 수정") + '</h2><span class="ghost"></span></div>' +
      subjectSwitchHtml() +
      '<p class="lede">' + escapeHtml(state.site) + " · " + currentMeta().name + " · " + yearOf(draft.date) + "년 " + sessionLabel(draft.session) + "</p>" +
      '<div class="stack">' +
        '<label class="field"><span>시험일</span><input id="f-date" type="date" value="' + draft.date + '"></label>' +
        '<label class="field"><span>회차</span><input id="f-session" type="number" min="1" max="366" step="1" value="' + Number(draft.session) + '"></label>' +
        '<p class="muted">1회에 1/12, 1/13처럼 시험일이 여러 날 있습니다. 아직 안 본 날은 미확인(예정), 시험이 없으면 미실시.</p>' +
        '<div class="field"><span>출제 품목</span><div class="stack" id="f-items">' +
          currentItems().map(function (item) {
            return '<button type="button" class="choice' + (draft.itemId === item.id ? " on" : "") + '" data-item="' + item.id + '">' +
              escapeHtml(item.name) + "</button>";
          }).join("") + "</div></div>" +
        '<label class="field"><span>메모</span><input id="f-note" type="text" maxlength="80" placeholder="감독 전달, 배합 특이사항" value="' + escapeHtml(draft.note) + '"></label>' +
      "</div>" +
      (dup ? '<p class="warn">같은 날짜 기록이 이미 있습니다. 저장하면 그 날을 덮습니다.</p>' : "") +
      '<button class="btn btn-primary" id="save">저장</button>' +
      (isNew ? "" : '<button class="btn btn-danger" id="del">삭제</button>') +
      tabBar("log");
    bindNav();
    document.getElementById("f-date").addEventListener("change", function () {
      draft.date = this.value;
      if (isNew) draft.session = inferSession(draft.date);
      renderEditor(isNew);
    });
    document.getElementById("f-session").addEventListener("change", function () {
      draft.session = parseSession(this.value) || inferSession(draft.date);
      renderEditor(isNew);
    });
    document.getElementById("f-note").addEventListener("input", function () { draft.note = this.value; });
    document.getElementById("f-items").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-item]");
      if (!btn) return;
      draft.itemId = btn.getAttribute("data-item");
      renderEditor(isNew);
    });
    document.getElementById("save").addEventListener("click", function () {
      if (!draft.date || !draft.itemId) return;
      draft.session = parseSession(document.getElementById("f-session").value) || inferSession(draft.date);
      state.records = state.records.filter(function (row) {
        if (row.id === draft.id) return false;
        if (row.date === draft.date) return false;
        return true;
      });
      state.records.push({
        id: draft.id,
        date: draft.date,
        session: Number(draft.session),
        itemId: draft.itemId,
        note: (draft.note || "").trim()
      });
      var savedDate = draft.date;
      saveState();
      draft = null;
      go("/day/" + savedDate);
    });
    var del = document.getElementById("del");
    if (del) {
      del.addEventListener("click", function () {
        if (!confirm("이 날짜 기록을 지울까요?")) return;
        state.records = state.records.filter(function (row) { return row.id !== draft.id; });
        saveState();
        draft = null;
        go("/log");
      });
    }
  }

  function fmtPct(v) {
    return (v * 100).toFixed(1) + "%";
  }

  function renderEval() {
    root.innerHTML =
      '<div class="topbar"><button class="ghost" data-go="/settings">닫기</button><h2>예측 검증</h2><span class="ghost"></span></div>' +
      '<p class="lede">과거 시점으로 돌아가 그때까지 데이터만으로 다음 날을 맞혔는지 봅니다. 계산에 몇 초 걸릴 수 있습니다.</p>' +
      '<button class="btn btn-primary" id="run-eval">Walk-Forward 실행</button>' +
      '<div id="eval-box" class="muted" style="margin-top:16px">아직 실행하지 않았습니다.</div>' +
      tabBar("predict");
    bindNav();
    document.getElementById("run-eval").addEventListener("click", function () {
      var box = document.getElementById("eval-box");
      if (!window.BakeryPredict) {
        box.textContent = "예측 엔진을 불러오지 못했습니다.";
        return;
      }
      box.textContent = "계산 중...";
      setTimeout(function () {
        var fit = BakeryPredict.evaluate(state.records, currentItems());
        var c = fit.compared || {};
        function block(title, m) {
          if (!m || !m.n) return "";
          return '<p class="section-title">' + title + '</p><div class="card">' +
            '<div class="metric"><span>시험 수</span><b>' + m.n + "</b></div>" +
            '<div class="metric"><span>Top 1</span><b>' + fmtPct(m.top1) + "</b></div>" +
            '<div class="metric"><span>Top 3</span><b>' + fmtPct(m.top3) + "</b></div>" +
            '<div class="metric"><span>Top 5</span><b>' + fmtPct(m.top5) + "</b></div>" +
            '<div class="metric"><span>MRR</span><b>' + m.mrr.toFixed(3) + "</b></div>" +
            '<div class="metric"><span>Log Loss</span><b>' + m.logloss.toFixed(3) + "</b></div></div>";
        }
        box.innerHTML =
          '<p class="muted">현재 앱은 기본 출제율 + 최근 반복 억제(대기 상한 22시험)를 씁니다. 오래 안 나온 희귀 품목에 가점하지 않습니다.</p>' +
          block("현재 모델(회차 잔여+공백)", c.remain) +
          block("기존 혼합 모델", c.hybrid) +
          block("기존 공백점수 방식", c.old) +
          block("전체 빈도만", c.freq) +
          block("최근 빈도만", c.recent);
      }, 30);
    });
  }

  function renderUpload() {
    root.innerHTML =
      '<div class="topbar"><button class="ghost" data-go="/log">닫기</button><h2>TXT 일괄</h2><span class="ghost"></span></div>' +
      '<p class="lede">지금 종목은 ' + currentMeta().name + "입니다. 파일 첫줄에 종목: 제빵 또는 종목: 제과를 적으면 그쪽 기록으로 들어갑니다.</p>" +
      '<p class="section-title">형식</p>' +
      '<pre class="sample">종목: ' + currentMeta().name + "\n시험장: 남부\n2026-01-12 1회 품목이름\n2026-01-13 1회 미확인\n2026-09-15 18회 예정</pre>" +
      '<label class="field" style="margin-top:16px"><span>붙여넣기</span>' +
      '<textarea id="bulk" placeholder="여기에 붙여넣거나 아래에서 TXT를 고르세요"></textarea></label>' +
      '<label class="btn btn-secondary" for="txt-file">TXT 파일 선택</label>' +
      '<input id="txt-file" class="hidden" type="file" accept=".txt,.csv,text/plain">' +
      '<label class="lede" style="display:flex;align-items:center;gap:8px;margin-top:12px">' +
      '<input id="replace" type="checkbox"> 기존 기록을 지우고 이 내용만 남기기</label>' +
      '<button class="btn btn-primary" id="apply">반영</button>' +
      '<button class="btn btn-secondary" id="sample">빈 양식 받기</button>' +
      '<p class="section-title">결과</p>' +
      '<div id="result" class="muted">아직 반영하지 않았습니다.</div>' +
      tabBar("log");
    bindNav();
    function fillFromFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () { document.getElementById("bulk").value = reader.result; };
      reader.readAsText(file, "utf-8");
    }
    document.getElementById("txt-file").addEventListener("change", function () {
      fillFromFile(this.files && this.files[0]);
    });
    document.getElementById("sample").addEventListener("click", function () {
      downloadText("기출_" + currentMeta().name + "_양식.txt",
        "종목: " + currentMeta().name + "\n" +
        "시험장: " + state.site + "\n" +
        "# 형식: 날짜  회차  품목\n" +
        "# 회차를 모르면 날짜와 품목만 적어도 됩니다.\n" +
        "# 품목 모르면 미확인, 아직 안 본 날은 예정, 시험 없으면 미실시\n");
    });
    document.getElementById("apply").addEventListener("click", function () {
      var parsed = parseTxtRecords(document.getElementById("bulk").value);
      var box = document.getElementById("result");
      if (!parsed.records.length && !parsed.errors.length) {
        box.innerHTML = '<p class="warn">넣을 줄이 없습니다.</p>';
        return;
      }
      if (parsed.records.length) applyTxtImport(parsed, document.getElementById("replace").checked);
      box.innerHTML =
        (parsed.records.length ? '<p class="ok">' + parsed.records.length + "건 반영</p>" : "") +
        (parsed.errors.length
          ? '<p class="warn">건너뛴 줄</p><p class="muted">' + parsed.errors.map(escapeHtml).join("<br>") + "</p>"
          : '<p class="muted">오류 없음</p>') +
        (parsed.records.length ? '<button class="btn btn-secondary" data-go="/log">기록 보기</button>' : "");
      bindNav();
    });
  }

  function renderSettings() {
    root.innerHTML =
      '<div class="topbar"><button class="ghost" data-go="/">닫기</button><h2>시험장</h2><button class="ghost" type="button" id="refresh-app">새로고침</button></div>' +
      '<p class="lede">제빵과 제과 기출은 따로 저장됩니다. 지금 화면은 ' + currentMeta().name + "입니다.</p>" +
      '<label class="field"><span>' + currentMeta().name + ' 시험장</span><input id="site" type="text" maxlength="40" value="' + escapeHtml(state.site) + '"></label>' +
      '<button class="btn btn-primary" id="save-site">이름 저장</button>' +
      '<p class="section-title">예측 검증</p>' +
      '<p class="muted">과거 데이터로 모델 성능을 비교합니다.</p>' +
      '<button class="btn btn-secondary" data-go="/eval">Walk-Forward 보기</button>' +
      '<p class="section-title">기출 TXT</p>' +
      '<p class="muted">메모장에서 모아 둔 기출을 올리거나, 지금 기록을 TXT로 받습니다.</p>' +
      '<button class="btn btn-secondary" data-go="/upload">TXT 일괄 넣기</button>' +
      '<button class="btn btn-secondary" id="export-txt">기출 TXT로 받기</button>' +
      '<p class="section-title">백업 JSON</p>' +
      '<p class="muted">이 브라우저 안 복사본입니다. GitHub 연결 없음.</p>' +
      '<button class="btn btn-secondary" id="export">JSON 내보내기</button>' +
      '<label class="btn btn-secondary" for="import">JSON 가져오기</label>' +
      '<input id="import" class="hidden" type="file" accept="application/json">' +
      '<div class="footer-actions"><button type="button" id="reset">모든 기록 지우기</button></div>' +
      tabBar("predict");
    bindNav();
    bindRefresh();
    document.getElementById("save-site").addEventListener("click", function () {
      var name = document.getElementById("site").value.trim() || "시험장 1곳";
      state.site = name;
      saveState();
      go("/");
    });
    document.getElementById("export-txt").addEventListener("click", function () {
      downloadText("기출_" + currentMeta().name + ".txt", recordsToTxt());
    });
    document.getElementById("export").addEventListener("click", function () {
      persistActive();
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "bakery-predict-local.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });
    document.getElementById("import").addEventListener("change", function () {
      var file = this.files && this.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(reader.result);
          if (!parsed) throw new Error("format");
          if (parsed.subjects) {
            state = parsed;
            if (!state.subjects.bread) state.subjects.bread = defaultBag();
            if (!state.subjects.pastry) state.subjects.pastry = defaultBag();
            activateSubject(state.subject || "bread");
          } else if (Array.isArray(parsed.records)) {
            persistActive();
            state.site = parsed.site || state.site;
            state.records = parsed.records;
          } else {
            throw new Error("format");
          }
          saveState();
          go("/");
        } catch (e) {
          alert("가져올 수 없는 파일입니다.");
        }
      };
      reader.readAsText(file);
    });
    document.getElementById("reset").addEventListener("click", function () {
      if (!confirm("제빵·제과 기록과 예상이 모두 지워집니다.")) return;
      state = defaultState();
      saveState();
      go("/");
    });
  }

  function render() {
    var parsed = parseHash();
    var sub = parsed.params.get("s");
    if (sub && SUBJECTS[sub] && sub !== state.subject) {
      persistActive();
      activateSubject(sub);
      saveState();
      hitCache = { key: "", value: null };
    }
    var parts = parsed.parts;
    if (parts[0] === "month") return renderMonth();
    if (parts[0] === "day") return renderDay();
    if (parts[0] === "log") { draft = null; return renderLog(); }
    if (parts[0] === "upload") { draft = null; return renderUpload(); }
    if (parts[0] === "items") { draft = null; return renderItems(); }
    if (parts[0] === "eval") { draft = null; return renderEval(); }
    if (parts[0] === "settings") { draft = null; return renderSettings(); }
    if (parts[0] === "new") return renderEditor(true);
    if (parts[0] === "edit") return renderEditor(false);
    draft = null;
    renderHome();
  }

  window.addEventListener("hashchange", render);
  render();
  loadRemoteTxt().then(function (changed) {
    if (changed) render();
  });
})();
  </script>
</body>
</html>
